services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: viavinilo
      POSTGRES_PASSWORD: viavinilo
      POSTGRES_DB: viavinilo
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viavinilo"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Captura los mails salientes en desarrollo: http://localhost:8025
  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
