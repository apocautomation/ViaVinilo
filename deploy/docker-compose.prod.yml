# Producción en el VPS (D-037). Se corre desde /srv/viavinilo:
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
# Ningún contenedor publica puertos al exterior: Docker saltea ufw (D-035).
# Solo se exponen en 127.0.0.1 y al público se sale únicamente por Caddy.

name: viavinilo

x-app: &app
  image: viavinilo-app:latest
  # La imagen la construye el servicio api; los demás no la buscan en un registro.
  pull_policy: never
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL: postgresql://viavinilo:${POSTGRES_PASSWORD}@postgres:5432/viavinilo?schema=public
    REDIS_URL: redis://redis:6379
    TZ: America/Argentina/Salta
    # Modo producción de Node y Next (sin mensajes de desarrollo en el log).
    NODE_ENV: production
    # Bot del chat de la app con IA local (D-057). Se pisan acá para que no dependan del .env.
    BOT_API_URL: http://ollama:11434/v1
    BOT_MODEL: ${BOT_MODEL:-qwen3:8b}
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_started }

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: viavinilo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}
      POSTGRES_DB: viavinilo
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viavinilo"]
      interval: 5s
      retries: 20

  # Backup diario de la base (D-063): un archivo por día en el volumen "backups", 14 días.
  # OJO: queda en el mismo disco del VPS. La copia fuera del VPS es un paso aparte.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: viavinilo
      PGPASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}
      PGDATABASE: viavinilo
      TZ: America/Argentina/Salta
      BACKUP_KEEP_DAYS: "14"
    depends_on:
      postgres: { condition: service_healthy }
    volumes:
      - backups:/backups
      - ./backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

  api:
    <<: *app
    pull_policy: build
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?falta NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SUPPORT_WHATSAPP_URL: ${SUPPORT_WHATSAPP_URL:-}
    working_dir: /app/apps/api
    # Aplica las migraciones pendientes antes de arrancar.
    command: ["sh", "-c", "./node_modules/.bin/prisma migrate deploy && node dist/main.js"]
    environment:
      DATABASE_URL: postgresql://viavinilo:${POSTGRES_PASSWORD}@postgres:5432/viavinilo?schema=public
      REDIS_URL: redis://redis:6379
      TZ: America/Argentina/Salta
      NODE_ENV: production
      API_PORT: "3001"
      BOT_API_URL: http://ollama:11434/v1
      BOT_MODEL: ${BOT_MODEL:-qwen3:8b}
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - storage:/app/storage

  worker:
    <<: *app
    working_dir: /app/apps/worker
    command: ["node", "dist/main.js"]
    depends_on:
      api: { condition: service_started }
      ollama: { condition: service_started }
    volumes:
      - storage:/app/storage

  web:
    <<: *app
    working_dir: /app/apps/web
    command: ["./node_modules/.bin/next", "start", "--port", "3000"]
    depends_on:
      api: { condition: service_started }
    ports:
      - "127.0.0.1:3000:3000"

  pwa:
    <<: *app
    working_dir: /app/apps/pwa
    command: ["./node_modules/.bin/next", "start", "--port", "3002"]
    depends_on: []
    ports:
      - "127.0.0.1:3002:3002"

  # IA local del bot (D-057). Sin puertos: solo la ve el worker por la red interna de Docker.
  # Usa 3 de los 4 núcleos para que la API y el resto sigan respondiendo mientras el bot piensa.
  ollama:
    image: ollama/ollama:0.40.15
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: "24h"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      # El prompt del bot ocupa ~3.400 tokens: con 4.096 se cortaría el hilo.
      OLLAMA_CONTEXT_LENGTH: "8192"
    cpus: 3
    # D-098: qwen3:8b con 8.192 de contexto usa ~7,9 GB: con 8 GB quedaba al límite.
    # D-101: en una tanda de 60 consultas seguidas pasó los 10 GB y se cortó el modelo. El resto de los
    # servicios usa menos de 1 GB: con 12 GB quedan ~3,5 GB libres en el servidor (16 GB).
    mem_limit: 12g
    volumes:
      - ollama:/root/.ollama

volumes:
  backups:
  ollama:
  pgdata:
  redisdata:
  storage:
